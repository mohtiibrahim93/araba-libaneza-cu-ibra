name: YallaNative

options:
  bundleIdPrefix: com.centruldearabalibaneza
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  YallaCore:
    path: .

targets:
  YallaApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Resources
    resources:
      - path: App/Resources
    dependencies:
      - package: YallaCore
        product: YallaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centruldearabalibaneza.app
        PRODUCT_NAME: YallaApp
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Araba libaneza"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microfonul este folosit doar când alegi să te înregistrezi pentru Spune și compară."
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

schemes:
  YallaApp:
    build:
      targets:
        YallaApp: all
    run:
      config: Debug
    archive:
      config: Release
