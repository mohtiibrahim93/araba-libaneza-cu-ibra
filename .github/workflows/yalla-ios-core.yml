name: Yalla iOS Core CI

on:
  push:
    branches:
      - yalla-app-ios
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-and-importer:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version | tee /tmp/swift-version.log

      - name: Run Swift core tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path ios-app 2>&1 | tee /tmp/swift-test.log

      - name: Preserve Swift diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-diagnostics
          path: |
            /tmp/swift-version.log
            /tmp/swift-test.log
          if-no-files-found: warn
          retention-days: 1

      - name: Run importer unit tests
        run: node --test ios-app/Tools/YallaImporter/tests/importer.test.mjs

      - name: Build and validate native content bundle
        run: |
          node ios-app/Tools/YallaImporter/yalla-importer.mjs \
            --source public/yalla \
            --output /tmp/yalla-native-content.json \
            --content-version bundled-legacy
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/yalla-native-content.json').read_text())
          assert data['manifest']['schemaVersion'] == 3
          assert data['expressions'], 'Importer produced no expressions'
          assert data['units'], 'Importer produced no Journey units'
          assert data['lexiconCollections'], 'Importer produced no lexicon collections'
          print(
              'Imported',
              len(data['expressions']), 'expressions,',
              len(data['units']), 'Journey units,',
              len(data['lexiconCollections']), 'lexicon collections,',
              len(data['exercises']), 'explicit exercises'
          )
          PY

      - name: Bootstrap native content resource
        shell: bash
        run: |
          set -euo pipefail
          resource=ios-app/App/Resources/yalla-native-content.json
          if [[ -f "$resource" ]]; then
            echo "Native content resource already exists; no bootstrap commit needed."
            exit 0
          fi

          mkdir -p "$(dirname "$resource")"
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/yalla-native-content.json')
          target = Path('ios-app/App/Resources/yalla-native-content.json')
          data = json.loads(source.read_text())
          target.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$resource"
          git commit -m "chore(ios): add generated native content bundle"
          git push origin HEAD:yalla-app-ios
