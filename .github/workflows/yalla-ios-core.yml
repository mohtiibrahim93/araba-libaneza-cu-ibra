name: Yalla iOS Core CI

on:
  push:
    branches:
      - yalla-app-ios
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-importer:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version | tee /tmp/swift-version.log

      - name: Run Swift core tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path ios-app 2>&1 | tee /tmp/swift-test.log

      - name: Preserve Swift diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swift-core-diagnostics
          path: |
            /tmp/swift-version.log
            /tmp/swift-test.log
          if-no-files-found: warn
          retention-days: 1

      - name: Run importer unit tests
        run: node --test ios-app/Tools/YallaImporter/tests/importer.test.mjs

      - name: Build and validate native content bundle
        run: |
          node ios-app/Tools/YallaImporter/yalla-importer.mjs \
            --source public/yalla \
            --output /tmp/yalla-native-content.json \
            --content-version bundled-legacy
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/yalla-native-content.json')
          data = json.loads(source.read_text())
          assert data['manifest']['schemaVersion'] == 3
          assert data['expressions'], 'Importer produced no expressions'
          assert data['units'], 'Importer produced no Journey units'
          assert data['lexiconCollections'], 'Importer produced no lexicon collections'
          print(
              'Imported',
              len(data['expressions']), 'expressions,',
              len(data['units']), 'Journey units,',
              len(data['lexiconCollections']), 'lexicon collections,',
              len(data['exercises']), 'explicit exercises,',
              len(data.get('roots', [])), 'approved roots'
          )
          PY

      - name: Verify checked-in native content is reproducible
        run: cmp /tmp/yalla-native-content.json ios-app/App/Resources/yalla-native-content.json

  native-app-build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build native iOS app
        working-directory: ios-app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project YallaNative.xcodeproj \
            -scheme YallaApp \
            -sdk iphonesimulator \
            -derivedDataPath /tmp/yalla-native-derived \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/yalla-xcodebuild.log

      - name: Verify built app resources
        run: python3 ios-app/Tools/verify_app_bundle.py /tmp/yalla-native-derived/Build/Products/Debug-iphonesimulator/YallaApp.app

      - name: Select iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone Simulator found")
          ')"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Selected simulator: $SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run iPhone UI smoke tests
        working-directory: ios-app
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/yalla-ui-tests.xcresult
          xcodebuild             -project YallaNative.xcodeproj             -scheme YallaApp             -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"             -derivedDataPath /tmp/yalla-native-derived             -resultBundlePath /tmp/yalla-ui-tests.xcresult             CODE_SIGNING_ALLOWED=NO             -skip-testing:YallaAppUITests/YallaScreenshotTests             test 2>&1 | tee /tmp/yalla-uitest.log

      - name: Capture light and dark screenshots
        if: always()
        continue-on-error: true
        working-directory: ios-app
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/yalla-screenshots /tmp/yalla-screens-*.xcresult
          mkdir -p /tmp/yalla-screenshots
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          status=0
          for mode in light dark; do
            xcrun simctl ui "$SIMULATOR_UDID" appearance "$mode"
            # Fresh install per appearance so both runs show the same first-launch flow.
            xcrun simctl uninstall "$SIMULATOR_UDID" com.centruldearabalibaneza.app || true
            TEST_RUNNER_SCREENSHOT_DIR=/tmp/yalla-screenshots \
            TEST_RUNNER_SCREENSHOT_PREFIX="$mode" \
            xcodebuild \
              -project YallaNative.xcodeproj \
              -scheme YallaApp \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
              -derivedDataPath /tmp/yalla-native-derived \
              -resultBundlePath "/tmp/yalla-screens-$mode.xcresult" \
              -only-testing:YallaAppUITests/YallaScreenshotTests \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building 2>&1 | tee "/tmp/yalla-screens-$mode.log" || status=1
          done
          xcrun simctl ui "$SIMULATOR_UDID" appearance light || true
          # Fallback: recover PNGs from the result bundles if direct writes were unavailable.
          if ! ls /tmp/yalla-screenshots/*.png >/dev/null 2>&1; then
            for mode in light dark; do
              out="/tmp/yalla-attachments-$mode"
              rm -rf "$out" && mkdir -p "$out"
              xcrun xcresulttool export attachments --path "/tmp/yalla-screens-$mode.xcresult" --output-path "$out" || continue
              python3 - "$out" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          manifest = json.loads((out / 'manifest.json').read_text())
          for test in manifest:
              for item in test.get('attachments', []):
                  name = item.get('suggestedHumanReadableName', '')
                  stem = name.split('.png')[0].split('_')[0] if name.count('.png') == 0 else name.split('.png')[0]
                  if stem:
                      shutil.copy(out / item['exportedFileName'], Path('/tmp/yalla-screenshots') / f'{stem}.png')
          PY
            done
          fi
          ls -la /tmp/yalla-screenshots
          exit $status

      - name: Publish screenshots branch
        if: always() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! ls /tmp/yalla-screenshots/*.png >/dev/null 2>&1; then
            echo "No screenshots to publish."
            exit 0
          fi
          publish="$RUNNER_TEMP/yalla-screenshots-publish"
          rm -rf "$publish" && mkdir -p "$publish"
          cp /tmp/yalla-screenshots/*.png "$publish/"
          cd "$publish"
          {
            echo "# Yalla iOS screenshots"
            echo
            echo "Source commit: \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`"
            echo "CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Screen | Light | Dark |"
            echo "| --- | --- | --- |"
            for light in light-*.png; do
              [ -e "$light" ] || continue
              name="${light#light-}"
              dark="dark-$name"
              darkcell=""
              [ -e "$dark" ] && darkcell="<img src=\"$dark\" width=\"260\">"
              echo "| ${name%.png} | <img src=\"$light\" width=\"260\"> | $darkcell |"
            done
          } > README.md
          echo "$GITHUB_SHA" > SOURCE_COMMIT
          git init -q -b yalla-app-ios-screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:yalla-app-ios-screenshots

      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yalla-screenshots
          path: /tmp/yalla-screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve UI test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yalla-ui-smoke-test-evidence
          path: |
            /tmp/yalla-uitest.log
            /tmp/yalla-ui-tests.xcresult
          if-no-files-found: warn
          retention-days: 3

      - name: Preserve Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcode-build-diagnostics
          path: /tmp/yalla-xcodebuild.log
          if-no-files-found: warn
          retention-days: 1
