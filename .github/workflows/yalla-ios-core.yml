name: Yalla iOS Core CI

on:
  push:
    branches:
      - yalla-app-ios
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-importer:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version | tee /tmp/swift-version.log

      - name: Run Swift core tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path ios-app 2>&1 | tee /tmp/swift-test.log

      - name: Preserve Swift diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swift-core-diagnostics
          path: |
            /tmp/swift-version.log
            /tmp/swift-test.log
          if-no-files-found: warn
          retention-days: 1

      - name: Run importer unit tests
        run: node --test ios-app/Tools/YallaImporter/tests/importer.test.mjs

      - name: Build and validate native content bundle
        run: |
          node ios-app/Tools/YallaImporter/yalla-importer.mjs \
            --source public/yalla \
            --output /tmp/yalla-native-content.json \
            --content-version bundled-legacy
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/yalla-native-content.json')
          data = json.loads(source.read_text())
          assert data['manifest']['schemaVersion'] == 3
          assert data['expressions'], 'Importer produced no expressions'
          assert data['units'], 'Importer produced no Journey units'
          assert data['lexiconCollections'], 'Importer produced no lexicon collections'
          print(
              'Imported',
              len(data['expressions']), 'expressions,',
              len(data['units']), 'Journey units,',
              len(data['lexiconCollections']), 'lexicon collections,',
              len(data['exercises']), 'explicit exercises,',
              len(data.get('roots', [])), 'approved roots'
          )
          PY

      - name: Verify checked-in native content is reproducible
        run: cmp /tmp/yalla-native-content.json ios-app/App/Resources/yalla-native-content.json

  native-app-build:
    runs-on: macos-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build native iOS app
        working-directory: ios-app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project YallaNative.xcodeproj \
            -scheme YallaApp \
            -sdk iphonesimulator \
            -derivedDataPath /tmp/yalla-native-derived \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/yalla-xcodebuild.log

      - name: Verify built app resources
        run: python3 ios-app/Tools/verify_app_bundle.py /tmp/yalla-native-derived/Build/Products/Debug-iphonesimulator/YallaApp.app

      - name: Select iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone Simulator found")
          ')"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Selected simulator: $SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run iPhone UI smoke tests
        working-directory: ios-app
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/yalla-ui-tests.xcresult
          xcodebuild             -project YallaNative.xcodeproj             -scheme YallaApp             -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"             -derivedDataPath /tmp/yalla-native-derived             -resultBundlePath /tmp/yalla-ui-tests.xcresult             CODE_SIGNING_ALLOWED=NO             test 2>&1 | tee /tmp/yalla-uitest.log

      - name: Preserve UI test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yalla-ui-smoke-test-evidence
          path: |
            /tmp/yalla-uitest.log
            /tmp/yalla-ui-tests.xcresult
          if-no-files-found: warn
          retention-days: 3

      - name: Preserve Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcode-build-diagnostics
          path: /tmp/yalla-xcodebuild.log
          if-no-files-found: warn
          retention-days: 1
